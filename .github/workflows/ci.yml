name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

jobs:
  # Fast checks run first
  check:
    name: Lint, Typecheck, Knip, Audit
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
      diff_base: ${{ steps.scope.outputs.diff_base }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify previous full CI succeeded
        id: previous-ci
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const expected = [
              'Lint, Typecheck, Knip, Audit',
              'Unit Tests & Build',
              'E2E Tests (Shard 1/2)',
              'E2E Tests (Shard 2/2)',
              'Radix Cross-Browser E2E (chromium)',
              'Radix Cross-Browser E2E (firefox)',
              'Radix Cross-Browser E2E (webkit)',
            ];
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.before,
              filter: 'latest',
              per_page: 100,
            });
            const expectedNames = new Set(expected);
            const suites = new Map();
            for (const run of data.check_runs) {
              if (
                run.app?.slug !== 'github-actions' ||
                !expectedNames.has(run.name) ||
                !run.check_suite?.id
              ) {
                continue;
              }
              const suite = suites.get(run.check_suite.id) ?? {
                runs: new Map(),
              };
              const current = suite.runs.get(run.name);
              if (!current || run.id > current.id) {
                suite.runs.set(run.name, run);
              }
              suites.set(run.check_suite.id, suite);
            }
            const gateName = 'Lint, Typecheck, Knip, Audit';
            const latestSuite = [...suites.values()]
              .filter((suite) => suite.runs.has(gateName))
              .sort(
                (left, right) =>
                  right.runs.get(gateName).id - left.runs.get(gateName).id,
              )[0];
            const passed = expected.every(
              (name) => latestSuite?.runs.get(name)?.conclusion === 'success',
            );
            core.info(
              passed
                ? 'All reusable checks passed on the previous SHA.'
                : 'Previous checks are missing, pending, or unsuccessful; full CI is required.',
            );
            return passed;

      - name: Determine CI scope
        id: scope
        shell: bash
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BEFORE_SHA: ${{ github.event.before }}
        run: |
          scripts/ci-scope.sh \
            "$GITHUB_EVENT_NAME" \
            "$PR_ACTION" \
            "$PR_BASE_SHA" \
            "$PR_HEAD_SHA" \
            "$PR_BEFORE_SHA" \
            "${{ steps.previous-ci.outputs.result }}"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.scope.outputs.full_ci != 'false'
        run: make install

      - name: Run checks (lint, typecheck, knip, audit)
        if: steps.scope.outputs.full_ci != 'false'
        run: make check

      - name: Check changed documentation formatting
        if: steps.scope.outputs.full_ci == 'false'
        shell: bash
        env:
          DIFF_BASE_SHA: ${{ steps.scope.outputs.diff_base }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          format_files=()
          while IFS= read -r -d '' path; do
            format_files+=("$path")
          done < <(
            scripts/changed-docs.sh "$DIFF_BASE_SHA" "$PR_HEAD_SHA"
          )
          if (( ${#format_files[@]} > 0 )); then
            printf '%s\0' "${format_files[@]}" |
              xargs -0 npx --yes prettier@3.8.1 --check --ignore-unknown --
          else
            echo 'No remaining documentation files require formatting.'
          fi

  # Unit tests and build
  test:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    needs: check
    # Keep the required check visible as skipped for docs-only pull requests.
    if: needs.check.outputs.full_ci != 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Run unit tests
        run: make test

      - name: Build all
        run: make build-all

  # E2E tests with sharding for speed
  e2e:
    name: E2E Tests (Shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # These no-op matrix jobs preserve the two exact required check names. A job-level
      # condition is evaluated before matrix expansion and would collapse them into one.
      - name: Skip expensive E2E for documentation-only changes
        if: needs.check.outputs.full_ci == 'false'
        run: echo 'Documentation-only change; required E2E context satisfied without browser tests.'

      - uses: actions/checkout@v5
        if: needs.check.outputs.full_ci != 'false'

      - uses: actions/setup-node@v5
        if: needs.check.outputs.full_ci != 'false'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: needs.check.outputs.full_ci != 'false'
        run: make install

      - name: Build widget
        if: needs.check.outputs.full_ci != 'false'
        run: make build-widget

      - name: Get Playwright version
        if: needs.check.outputs.full_ci != 'false'
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: needs.check.outputs.full_ci != 'false'
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        timeout-minutes: 5
        if: needs.check.outputs.full_ci != 'false' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        timeout-minutes: 5
        if: needs.check.outputs.full_ci != 'false' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E Tests (Shard ${{ matrix.shard }}/2)
        if: needs.check.outputs.full_ci != 'false'
        run: make test-e2e-shard SHARD=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Upload E2E Report
        uses: actions/upload-artifact@v5
        if: needs.check.outputs.full_ci != 'false' && failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Focused browser matrix for Radix-style host dialog compatibility
  radix-e2e:
    name: Radix Cross-Browser E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.full_ci != 'false'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Build widget
        run: make build-widget

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browser
        timeout-minutes: 5
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system deps
        timeout-minutes: 5
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run Radix E2E Tests (${{ matrix.browser }})
        run: make test-radix-e2e BROWSER=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload Radix E2E Report
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-radix-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # Deploy to preview CF Worker (merge queue only)
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Build all
        run: VERSION=$(git describe --tags --abbrev=0) make build-all

      - name: Deploy to preview
        run: npx wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Live E2E tests against real cross-origin deployment (merge queue only)
  live-preview-tests:
    name: Live Preview Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-preview]
    if: github.event_name == 'merge_group'
    env:
      LIVE_TARGET: preview
      PLAYWRIGHT_BASE_URL: https://bugdrop-widget-test-git-preview-jermwatts-projects.vercel.app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        timeout-minutes: 5
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        timeout-minutes: 5
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Wait for preview widget deployment
        run: |
          WORKER_URL="https://bugdrop-preview.neonwatty.workers.dev/api/health"
          echo "Polling $WORKER_URL until ready..."
          for i in $(seq 1 30); do
            if curl -sfo /dev/null "$WORKER_URL"; then
              echo "Preview worker ready after $((i * 10))s"
              exit 0
            fi
            echo "Attempt $i/30 — not ready, waiting 10s..."
            sleep 10
          done
          echo "Preview worker not ready after 300s"
          exit 1

      - name: Verify test venue is reachable
        run: |
          VENUE_URL="${PLAYWRIGHT_BASE_URL}"
          echo "Checking test venue at $VENUE_URL..."
          BYPASS_ARGS=""
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            BYPASS_ARGS="-H x-vercel-protection-bypass:${VERCEL_AUTOMATION_BYPASS_SECRET}"
          fi
          curl -sfo /dev/null $BYPASS_ARGS "$VENUE_URL" || (echo "Test venue unreachable at $VENUE_URL" && exit 1)
          echo "Test venue reachable"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Record expected preview widget asset
        run: |
          VERSION=$(git describe --tags --abbrev=0) npm run build:widget
          echo "EXPECTED_WIDGET_ORIGIN=https://bugdrop-preview.neonwatty.workers.dev" >> "$GITHUB_ENV"
          echo "EXPECTED_WIDGET_SHA256=$(shasum -a 256 public/widget.js | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Wait for expected preview widget asset
        run: |
          WIDGET_URL="https://bugdrop-preview.neonwatty.workers.dev/widget.js"
          echo "Waiting for $WIDGET_URL to serve $EXPECTED_WIDGET_SHA256..."
          for i in $(seq 1 30); do
            ACTUAL_SHA="$(curl -sSf "$WIDGET_URL" | shasum -a 256 | awk '{print $1}')"
            if [ "$ACTUAL_SHA" = "$EXPECTED_WIDGET_SHA256" ]; then
              echo "Preview widget asset matched after $((i * 5))s"
              exit 0
            fi
            echo "Attempt $i/30 served $ACTUAL_SHA; waiting 5s..."
            sleep 5
          done
          echo "Preview widget did not serve expected asset $EXPECTED_WIDGET_SHA256"
          exit 1

      - name: Run live E2E tests
        run: npx playwright test --project=chromium-live --workers=1
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Run live Radix E2E tests
        run: make test-live-radix
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-live-report
          path: playwright-report/
          retention-days: 7

  # Cross-browser live smoke tests against real cross-origin deployment (merge queue only)
  live-preview-cross-browser-tests:
    name: Live Preview Cross-Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-preview]
    if: github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      LIVE_TARGET: preview
      PLAYWRIGHT_BASE_URL: https://bugdrop-widget-test-git-preview-jermwatts-projects.vercel.app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browser
        timeout-minutes: 5
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system deps
        timeout-minutes: 5
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Verify test venue is reachable
        run: |
          VENUE_URL="${PLAYWRIGHT_BASE_URL}"
          echo "Checking test venue at $VENUE_URL..."
          BYPASS_ARGS=""
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            BYPASS_ARGS="-H x-vercel-protection-bypass:${VERCEL_AUTOMATION_BYPASS_SECRET}"
          fi
          curl -sfo /dev/null $BYPASS_ARGS "$VENUE_URL" || (echo "Test venue unreachable at $VENUE_URL" && exit 1)
          echo "Test venue reachable"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Record expected preview widget asset
        run: |
          VERSION=$(git describe --tags --abbrev=0) npm run build:widget
          echo "EXPECTED_WIDGET_ORIGIN=https://bugdrop-preview.neonwatty.workers.dev" >> "$GITHUB_ENV"
          echo "EXPECTED_WIDGET_SHA256=$(shasum -a 256 public/widget.js | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Wait for expected preview widget asset
        run: |
          WIDGET_URL="https://bugdrop-preview.neonwatty.workers.dev/widget.js"
          echo "Waiting for $WIDGET_URL to serve $EXPECTED_WIDGET_SHA256..."
          for i in $(seq 1 30); do
            ACTUAL_SHA="$(curl -sSf "$WIDGET_URL" | shasum -a 256 | awk '{print $1}')"
            if [ "$ACTUAL_SHA" = "$EXPECTED_WIDGET_SHA256" ]; then
              echo "Preview widget asset matched after $((i * 5))s"
              exit 0
            fi
            echo "Attempt $i/30 served $ACTUAL_SHA; waiting 5s..."
            sleep 5
          done
          echo "Preview widget did not serve expected asset $EXPECTED_WIDGET_SHA256"
          exit 1

      - name: Run cross-browser live smoke tests
        run: npx playwright test e2e/widget.cross-browser-live.spec.ts --project=${{ matrix.browser }}-cross-browser-live --workers=1
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload cross-browser test report
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-cross-browser-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
